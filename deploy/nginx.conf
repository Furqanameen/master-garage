# /etc/nginx/sites-available/mastermechanics.ae
# After edit: sudo nginx -t && sudo systemctl reload nginx

# HTTP → HTTPS on the canonical host (never keep www)
server {
    listen 80;
    listen [::]:80;
    server_name mastermechanics.ae www.mastermechanics.ae;
    return 301 https://mastermechanics.ae$request_uri;
}

# HTTPS www → HTTPS apex (this is the Search Console fix)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.mastermechanics.ae;

    ssl_certificate /etc/letsencrypt/live/mastermechanics.ae/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mastermechanics.ae/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://mastermechanics.ae$request_uri;
}

# Canonical site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mastermechanics.ae;

    ssl_certificate /etc/letsencrypt/live/mastermechanics.ae/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mastermechanics.ae/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;
    access_log /var/log/nginx/mastermechanics-access.log;
    error_log /var/log/nginx/mastermechanics-error.log;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
