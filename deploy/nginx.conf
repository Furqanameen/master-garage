# /etc/nginx/sites-available/mastermechanics.ae   (then: ln -s to sites-enabled, nginx -t, systemctl reload nginx)
# HTTPS certificate:  sudo certbot --nginx -d mastermechanics.ae -d www.mastermechanics.ae

server {
    listen 80;
    server_name mastermechanics.ae www.mastermechanics.ae;
    return 301 https://mastermechanics.ae$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.mastermechanics.ae;
    # certbot fills in the ssl_certificate lines
    return 301 https://mastermechanics.ae$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mastermechanics.ae;
    # ssl_certificate / ssl_certificate_key added by certbot

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers (the app sets the rest through helmet)
    add_header Strict-Transport-Security "max-age=31536000" always;
}
